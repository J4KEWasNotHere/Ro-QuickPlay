<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>
      <img src="../assets/icons/icon32.png" alt="" width="32" height="32">
      <span>Ro-QuickPlay Settings</span>
    </h1>

    <div class="setting">
      <label class="toggle-row" for="enabled">
        <input id="enabled" type="checkbox">
        <span>Enable game-card Play buttons</span>
      </label>
    </div>

    <div class="setting">
      <label class="setting-label" for="visibility">Button visibility</label>
      <select id="visibility">
        <option value="hover">Show on hover</option>
        <option value="always">Always show</option>
      </select>
    </div>

    <div class="setting">
      <label class="setting-label" for="position">Button position</label>
      <select id="position">
        <option value="top-left">Top left</option>
        <option value="top-right">Top right</option>
        <option value="bottom-left">Bottom left</option>
        <option value="bottom-right">Bottom right</option>
      </select>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <footer class="footer-wrap">
      <div class="footer">v<span id="app-version">?</span></div>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
